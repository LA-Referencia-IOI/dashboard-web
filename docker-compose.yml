version: "2"

volumes:
  dark-mysql-data:
    driver: local

  dark-redis-data:
    driver: local

services:
  mysql:
    image: mysql:5.7
    container_name: dark-mysql
    volumes:
      - dark-mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=dark
      - MYSQL_DATABASE=dark
      - MYSQL_USER=dark
      - MYSQL_PASSWORD=dark

  cache:
    image: redis:4.0
    container_name: dark-redis
    command: --appendonly yes
    volumes:
      - dark-redis-data:/data
    ports:
      - "6380:6379"

  app:
    image: ambientum/php:8.0-nginx
    container_name: dark-app
    volumes:
      - .:/var/www/app
    ports:
      - "8081:8080"
    environment:
      XDEBUG_ENABLED: "true"
    links:
      - mysql
      - cache
