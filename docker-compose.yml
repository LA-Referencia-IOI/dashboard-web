version: "2"

volumes:
  dark-mysql-data:
    driver: local

  dark-redis-data:
    driver: local

services:
  mysql:
    image: mysql:8.0
    container_name: dark-mysql
    volumes:
      - dark-mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=dark
      - MYSQL_DATABASE=dark
      - MYSQL_USER=dark
      - MYSQL_PASSWORD=dark

  cache:
    image: redis:4.0
    container_name: dark-redis
    command: --appendonly yes
    volumes:
      - dark-redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"

  app:
    image: ambientum/php:8.0-nginx
    container_name: dark-app
    volumes:
      - .:/var/www/app
    env_file:
      - .env.integration
    ports:
      - "${APPS_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    environment:
      XDEBUG_ENABLED: "true"
    links:
      - mysql
      - cache
    networks:
      - default
      - dark-net

networks:
  dark-net:
    external: true
    name: dark-net
